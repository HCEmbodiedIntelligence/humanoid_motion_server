# Example only: generic simulation code has no OpenArmX joint names.
robot_id: openarmx_01
visual_urdf: package://openarmx_description/urdf/robot/openarmx_robot.urdf
initial_pose: teleop_home_1
# The deployed home currently leaves the left elbow at its straight lower stop.
# Give both simulated arms the same bent elbow start, away from near-singularity.
# This overrides only the simulation snapshot, never the deployed real home pose.
initial_positions:
  openarmx_left_joint4: 0.99
  openarmx_right_joint4: 0.99
speed_limit: 3.0
watchdog_s: 0.1
# The existing gripper interface uses one finger's travel in metres (0..0.044).
# The opposite finger follows the URDF mimic relationship.
gripper_joints:
  left_gripper:
    joint: openarmx_left_finger_joint1
    scale: 1.0
  right_gripper:
    joint: openarmx_right_finger_joint1
    scale: 1.0
