humanoid_motion_control:
  ros__parameters:
    # Launch files provide the installed paths for these four resources.
    channel_config_file: ""
    sdk_config_file: ""
    tool_config_file: ""
    urdf_file: ""

    joint_state_endpoint: /hc_teleop/joint_states
    joint_command_endpoint: /hc_teleop/joint_cmd

    control_frequency_hz: 100.0
    input_stamp_max_age_s: 0.5
    input_stamp_future_tolerance_s: 0.1
    feedback_max_age_ms: 100
    servo_lease_ms: 100
    default_move_timeout_s: 60.0
    stable_duration_s: 0.10
    move_j_position_tolerance_rad: 0.01
    stopped_velocity_tolerance_rad_s: 0.02
    cartesian_position_tolerance_m: 0.005
    cartesian_orientation_tolerance_rad: 0.02

    joint_max_velocity_rad_s: 1.0
    joint_max_acceleration_rad_s2: 2.0
    joint_max_jerk_rad_s3: 10.0
    cartesian_max_linear_velocity_m_s: 0.30
    cartesian_max_linear_acceleration_m_s2: 0.60
    cartesian_max_linear_jerk_m_s3: 3.0
    cartesian_max_angular_velocity_rad_s: 1.0
    cartesian_max_angular_acceleration_rad_s2: 2.0
    cartesian_max_angular_jerk_rad_s3: 10.0

    joint_group_names: [left_arm, right_arm, upper_body, whole_body]
    groups.left_arm: [left_shoulder_pitch, left_elbow]
    groups.right_arm: [right_shoulder_pitch, right_elbow]
    groups.upper_body: [torso_yaw, neck_yaw, left_shoulder_pitch, left_elbow, right_shoulder_pitch, right_elbow]
    groups.whole_body: [torso_yaw, neck_yaw, left_shoulder_pitch, left_elbow, right_shoulder_pitch, right_elbow]

    group_lower_limits.left_arm: [-2.4, -2.5]
    group_upper_limits.left_arm: [2.4, 0.1]
    group_lower_limits.right_arm: [-2.4, -2.5]
    group_upper_limits.right_arm: [2.4, 0.1]
    group_lower_limits.upper_body: [-1.2, -1.5, -2.4, -2.5, -2.4, -2.5]
    group_upper_limits.upper_body: [1.2, 1.5, 2.4, 0.1, 2.4, 0.1]
    group_lower_limits.whole_body: [-1.2, -1.5, -2.4, -2.5, -2.4, -2.5]
    group_upper_limits.whole_body: [1.2, 1.5, 2.4, 0.1, 2.4, 0.1]
